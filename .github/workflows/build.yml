name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      upload_release:
        description: '是否创建 GitHub Release（只有打 tag 时才会自动创建）'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          # 只缓存依赖，不缓存项目自身产物，避免脏缓存导致诡异失败
          cache-on-failure: false

      # engine.js / dom.js / content.css 的单一真源在 extension/ 下，
      # 构建前必须同步过去，否则桌面版会用旧副本
      - name: Sync shared core modules
        shell: pwsh
        run: |
          Copy-Item extension/src/core/engine.js desktop/src/engine.js -Force
          Copy-Item extension/src/core/dom.js desktop/src/dom.js -Force
          Copy-Item extension/src/content/content.css desktop/src/content.css -Force
          Write-Host "synced:"
          Get-ChildItem desktop/src | Select-Object Name, Length | Format-Table -AutoSize

      # 前端是纯静态资源，构建时不会编译 JS：语法错会原样打进 exe，
      # 表现为「界面白了/语言失效」，所以先逐个 node --check
      - name: Syntax check (frontend js)
        shell: pwsh
        run: |
          Get-ChildItem desktop/src/*.js | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "syntax error in $($_.Name)" }
            Write-Host "ok $($_.Name)"
          }

      # 轻量单测：纯函数，不联网、不需要浏览器。挂了就不该发版
      - name: Unit tests (engine, no network)
        run: node test/unit.test.js

      - name: Unit tests (rust)
        working-directory: desktop/src-tauri
        run: cargo test --lib

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build (release + NSIS)
        working-directory: desktop
        run: tauri build

      - name: Show outputs
        shell: pwsh
        run: |
          Get-ChildItem desktop/src-tauri/target/release/DiscordTranslator.exe |
            Select-Object Name, @{n='MB';e={[Math]::Round($_.Length/1MB,2)}} | Format-Table
          Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter *.exe |
            Select-Object Name, @{n='MB';e={[Math]::Round($_.Length/1MB,2)}} | Format-Table

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: discord-translator-windows
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/DiscordTranslator.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe

      # 本地已经手动发过版的 tag（带 label、带 sha256），别让 CI 再覆盖一遍
      - name: Check existing release
        id: check
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "release $tag 已存在，跳过发布"
            "exists=yes" >> $env:GITHUB_OUTPUT
          } else {
            "exists=no" >> $env:GITHUB_OUTPUT
          }

      # 只有 push tag 时才发 Release；手动触发默认只出 artifact
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check.outputs.exists == 'no'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            desktop/src-tauri/target/release/DiscordTranslator.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
